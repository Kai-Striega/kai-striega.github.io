<svg xmlns="http://www.w3.org/2000/svg" width="720" height="350" viewBox="0 0 720 350" role="img" aria-labelledby="title desc">
  <title id="title">What a mispredicted branch throws away</title>
  <desc id="desc">A pipeline diagram over ten cycles. A branch instruction moves through fetch, decode and execute, resolving in cycle three. Two instructions fetched speculatively behind it, on the guessed path, are discarded when the guess turns out to be wrong. Refetching from the correct target only begins in cycle four, so the work done in cycles two and three is wasted.</desc>

  <rect x="0" y="0" width="720" height="350" fill="#f7f7f5"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">

    <text x="24" y="28" font-size="15" font-weight="600" fill="#1d1d1b">A wrong guess, and what it costs</text>

    <!-- Cycle header -->
    <text x="24" y="62" font-size="11" fill="#5a5a55">cycle</text>
    <g font-size="11" fill="#5a5a55" text-anchor="middle">
      <text x="162" y="62">1</text>
      <text x="206" y="62">2</text>
      <text x="250" y="62">3</text>
      <text x="294" y="62">4</text>
      <text x="338" y="62">5</text>
      <text x="382" y="62">6</text>
      <text x="426" y="62">7</text>
      <text x="470" y="62">8</text>
      <text x="514" y="62">9</text>
    </g>

    <!-- Resolve line -->
    <line x1="272" y1="70" x2="272" y2="252" stroke="#b5705f" stroke-width="2" stroke-dasharray="5 3"/>
    <text x="278" y="270" font-size="11" font-weight="600" fill="#b5705f">the branch resolves here, and the guess was wrong</text>

    <!-- Row 1: the branch -->
    <text x="24" y="92" font-size="11" fill="#1d1d1b">jle  (the branch)</text>
    <g font-size="10" text-anchor="middle" fill="#ffffff">
      <rect x="140" y="76" width="44" height="24" fill="#4a8f6a" stroke="#1f4a35"/><text x="162" y="92">IF</text>
      <rect x="184" y="76" width="44" height="24" fill="#4a8f6a" stroke="#1f4a35"/><text x="206" y="92">ID</text>
      <rect x="228" y="76" width="44" height="24" fill="#2f6f4f" stroke="#1f4a35"/><text x="250" y="92">EX</text>
      <rect x="272" y="76" width="44" height="24" fill="#4a8f6a" stroke="#1f4a35"/><text x="294" y="92">ME</text>
      <rect x="316" y="76" width="44" height="24" fill="#4a8f6a" stroke="#1f4a35"/><text x="338" y="92">WB</text>
    </g>

    <!-- Row 2: speculative +1, discarded -->
    <text x="24" y="122" font-size="11" fill="#8a8a82">guessed path +1</text>
    <g font-size="10" text-anchor="middle" fill="#ffffff">
      <rect x="184" y="106" width="44" height="24" fill="#b5705f" stroke="#7d4436"/><text x="206" y="122">IF</text>
      <rect x="228" y="106" width="44" height="24" fill="#b5705f" stroke="#7d4436"/><text x="250" y="122">ID</text>
    </g>
    <g stroke="#7d4436" stroke-width="1.2">
      <line x1="186" y1="108" x2="270" y2="128"/>
      <line x1="270" y1="108" x2="186" y2="128"/>
    </g>

    <!-- Row 3: speculative +2, discarded -->
    <text x="24" y="152" font-size="11" fill="#8a8a82">guessed path +2</text>
    <g font-size="10" text-anchor="middle" fill="#ffffff">
      <rect x="228" y="136" width="44" height="24" fill="#b5705f" stroke="#7d4436"/><text x="250" y="152">IF</text>
    </g>
    <g stroke="#7d4436" stroke-width="1.2">
      <line x1="230" y1="138" x2="270" y2="158"/>
      <line x1="270" y1="138" x2="230" y2="158"/>
    </g>

    <text x="286" y="140" font-size="11" font-weight="600" fill="#b5705f">discarded</text>

    <!-- Row 4: correct target -->
    <text x="24" y="182" font-size="11" fill="#1d1d1b">correct target</text>
    <g font-size="10" text-anchor="middle" fill="#ffffff">
      <rect x="272" y="166" width="44" height="24" fill="#4a8f6a" stroke="#1f4a35"/><text x="294" y="182">IF</text>
      <rect x="316" y="166" width="44" height="24" fill="#4a8f6a" stroke="#1f4a35"/><text x="338" y="182">ID</text>
      <rect x="360" y="166" width="44" height="24" fill="#4a8f6a" stroke="#1f4a35"/><text x="382" y="182">EX</text>
      <rect x="404" y="166" width="44" height="24" fill="#4a8f6a" stroke="#1f4a35"/><text x="426" y="182">ME</text>
      <rect x="448" y="166" width="44" height="24" fill="#4a8f6a" stroke="#1f4a35"/><text x="470" y="182">WB</text>
    </g>

    <!-- Row 5: correct +1 -->
    <text x="24" y="212" font-size="11" fill="#1d1d1b">correct target +1</text>
    <g font-size="10" text-anchor="middle" fill="#ffffff">
      <rect x="316" y="196" width="44" height="24" fill="#4a8f6a" stroke="#1f4a35"/><text x="338" y="212">IF</text>
      <rect x="360" y="196" width="44" height="24" fill="#4a8f6a" stroke="#1f4a35"/><text x="382" y="212">ID</text>
      <rect x="404" y="196" width="44" height="24" fill="#4a8f6a" stroke="#1f4a35"/><text x="426" y="212">EX</text>
      <rect x="448" y="196" width="44" height="24" fill="#4a8f6a" stroke="#1f4a35"/><text x="470" y="212">ME</text>
      <rect x="492" y="196" width="44" height="24" fill="#4a8f6a" stroke="#1f4a35"/><text x="514" y="212">WB</text>
    </g>

    <!-- Bubble bracket -->
    <g stroke="#b5705f" stroke-width="1.5" fill="none">
      <path d="M 184 236 L 184 244 L 272 244 L 272 236"/>
    </g>
    <text x="228" y="258" font-size="11" fill="#b5705f" text-anchor="middle">wasted</text>

    <!-- Legend -->
    <rect x="24" y="288" width="14" height="14" fill="#4a8f6a" stroke="#1f4a35"/>
    <text x="46" y="300" font-size="12" fill="#1d1d1b">work that counted</text>
    <rect x="200" y="288" width="14" height="14" fill="#b5705f" stroke="#7d4436"/>
    <text x="222" y="300" font-size="12" fill="#1d1d1b">work thrown away</text>

    <text x="24" y="322" font-size="11" fill="#5a5a55">A textbook five stage pipeline, drawn short so that it fits. A real Golden Cove core is far deeper,</text>
    <text x="24" y="336" font-size="11" fill="#5a5a55">which is why an actual misprediction costs a dozen cycles and more.</text>
  </g>
</svg>
