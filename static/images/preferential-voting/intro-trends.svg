<title id="t">Not more partisan, but more rejecting</title>
<desc id="d">Two line charts. Left: the gap between how much Labor and Liberal partisans like their own party and the other one, about 5.2 rating points in 1993 and 4.4 in 2025, with no upward trend. Right: the share of voters who give at least one party 0 out of 10, which fell from 41% in 1993 to 23% in 2001 and rose to 50% in 2025.</desc>
