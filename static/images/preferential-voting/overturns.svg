      [fill="#b0a98f"] { fill: #a8a184 }
      [stroke="#6b6552"] { stroke: #8a8470 }
    }
    /* Teal, for independents: only this series uses it. */
    @media (prefers-color-scheme: dark) {
      [fill="#008080"] { fill: #3fb8b8 }   [stroke="#008080"] { stroke: #3fb8b8 }
    }
  </style>
<title id="t">About one seat in twelve is won from behind</title>
<desc id="d">Stacked bar chart of 102 seats won from behind, 2004 to 2025: 8 in 2004, 9 in 2007, 11 in 2010, 15 in 2013, 16 in 2016, 12 in 2019, 16 in 2022, 15 in 2025. Labor won most; independents won 7 in 2022 and 5 in 2025.</desc>
