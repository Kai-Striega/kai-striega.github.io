<title id="t">The Senate-style stand-in misses most where an MP has a personal vote</title>
<desc id="d">Strip chart of 91 districts. Seats held by the Coalition all sit to the right of zero, by up to 17 points: the stand-in shows Labor stronger than the real ballots. Seats held by Labor straddle zero. The average lean is 3.3 points towards Labor.</desc>
