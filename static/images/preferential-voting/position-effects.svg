<text x="62.0" y="176.9" font-size="10" fill="#5a5a55" text-anchor="end" font-weight="normal">4×</text>
<line x1="70.0" y1="148.6" x2="690.0" y2="148.6" stroke="#e4e4de" stroke-width="1.0"/>
<text x="62.0" y="152.6" font-size="10" fill="#5a5a55" text-anchor="end" font-weight="normal">5×</text>
<line x1="70.0" y1="124.3" x2="690.0" y2="124.3" stroke="#e4e4de" stroke-width="1.0"/>
<text x="62.0" y="128.3" font-size="10" fill="#5a5a55" text-anchor="end" font-weight="normal">6×</text>
<line x1="70.0" y1="100.0" x2="690.0" y2="100.0" stroke="#e4e4de" stroke-width="1.0"/>
<text x="62.0" y="104.0" font-size="10" fill="#5a5a55" text-anchor="end" font-weight="normal">7×</text>
<line x1="70.0" y1="270.0" x2="690.0" y2="270.0" stroke="#b9b9b2" stroke-width="1.0"/>
<line x1="70.0" y1="245.7" x2="690.0" y2="245.7" stroke="#b9b9b2" stroke-width="1.5"/>
<rect x="97.9" y="170.0" width="46.5" height="100.0" fill="#1f6feb"/>
