<title id="t">Resampling single ballots makes the seat look far too predictable</title>
<desc id="d">Two histograms. Resampling whole collection points, the margin ranges from -1.3 to 2.3 points and 37.5% of replicates are squeezes. Resampling single ballots, it ranges from -0.3 to 0.8 points, with 17.5% squeezes.</desc>
