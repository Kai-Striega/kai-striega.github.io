<title id="t">Most first-past-the-post misses depend on voters not adapting</title>
<desc id="d">Line chart. With no switching, first past the post misses the Condorcet winner in 77 contests; if a quarter of third-party voters switch to the front-runner they prefer, 58; at half, 41; if all do, 2.</desc>
<rect width="760" height="320" fill="#f7f7f5"/>
