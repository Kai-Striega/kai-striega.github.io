<title id="t">One Nation draws preferences from the right, and gets few from the left</title>
<desc id="d">Two dot charts with 95% intervals. From Labor and Greens candidates, One Nation receives about a quarter of what a same-size Labor candidate would; from minor parties and independents, almost three times as much.</desc>
