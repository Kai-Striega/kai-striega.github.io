<text x="426.4" y="306.0" font-size="10" fill="#5a5a55" text-anchor="middle" font-weight="normal">2022</text>
<line x1="579.1" y1="100.0" x2="579.1" y2="290.0" stroke="#e4e4de" stroke-width="1.0"/>
<text x="579.1" y="306.0" font-size="10" fill="#5a5a55" text-anchor="middle" font-weight="normal">2025</text>
