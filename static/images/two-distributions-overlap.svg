<title id="t">The point estimates differ; the distributions overlap</title>
<desc id="d">Two overlaid density curves for the same sort on the same input, unstable in blue and stable in orange. The two dashed median lines sit clearly apart, yet the bodies of the two distributions overlap across most of their width.</desc>
