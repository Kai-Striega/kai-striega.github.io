<svg xmlns="http://www.w3.org/2000/svg" width="700" height="460" viewBox="0 0 700 460" role="img" aria-labelledby="t d">
  <style>
    /* Dark palette. CSS beats presentation attributes, so the drawing below is
       untouched. Shared verbatim across the mechanical-sympathy diagrams;
       selectors that match nothing here are harmless. */
    @media (prefers-color-scheme: dark) {
      /* canvas and neutrals */
      [fill="#f7f7f5"] { fill: #1b212a }   [stroke="#f7f7f5"] { stroke: #1b212a }
      [fill="#ffffff"] { fill: #262e3a }
      [fill="#1d1d1b"] { fill: #e3e8ee }   [stroke="#1d1d1b"] { stroke: #e3e8ee }
      [fill="#5a5a55"] { fill: #ced6dd }   [stroke="#5a5a55"] { stroke: #ced6dd }
      [fill="#6a6a63"] { fill: #9ca4af }
      [fill="#8a8a82"] { fill: #868f9c }   [stroke="#8a8a82"] { stroke: #868f9c }
      [fill="#a9a9a1"] { fill: #566072 }   [stroke="#a9a9a1"] { stroke: #566072 }
      [fill="#e8e8e2"] { fill: #333d4b }
      [fill="#dcdcd6"] { fill: #2f3947 }
      [stroke="#e4e4de"] { stroke: #394454 }
      [stroke="#b9b9b2"] { stroke: #48566b }
      [stroke="#c4c4bc"] { stroke: #48566b }
      /* blue */
      [fill="#1f6feb"] { fill: #6ea8ff }   [stroke="#1f6feb"] { stroke: #6ea8ff }
      [stroke="#12408c"] { stroke: #3d6fbf }
      [fill="#e8effb"] { fill: #1c2942 }
      /* orange */
      [fill="#c2410c"] { fill: #f08a4b }   [stroke="#c2410c"] { stroke: #f08a4b }
      [stroke="#7d2a08"] { stroke: #b35a2a }
      [fill="#f9e9e2"], [fill="#f8ebe7"], [fill="#f4ece7"] { fill: #33241c }
      /* green */
      [fill="#2f6f4f"] { fill: #57b98a }
      [stroke="#1f4a35"] { stroke: #2f7a56 }
      [fill="#4a8f6a"] { fill: #6fc79b }
      [fill="#7aa88c"] { fill: #86b89f }
      [fill="#f0f6f2"], [fill="#e3f0e9"], [fill="#d6e8de"] { fill: #1a2c24 }
      /* purple */
      [fill="#6b3fa0"] { fill: #a77dff }   [stroke="#6b3fa0"] { stroke: #a77dff }
      [fill="#f0eefa"] { fill: #251f38 }
      /* terracotta */
      [fill="#b5705f"] { fill: #d0917f }   [stroke="#b5705f"] { stroke: #d0917f }
      [stroke="#7d4436"] { stroke: #a5654f }
      /* memory-hierarchy only */
      [fill="#f7f5ee"] { fill: #1f2229 }
      [fill="#b0a98f"] { fill: #a8a184 }
      [stroke="#6b6552"] { stroke: #8a8470 }
    }
  </style>
<title id="t">Cost of counting, against how often the branch is taken</title>
<desc id="d">A line chart. The branchy version forms an inverted U: about 0.21 nanoseconds per element when the branch is never taken, rising to 2.62 nanoseconds when it is taken half the time at random, then falling back to 0.24 when always taken. The branchless version is flat at about 1.46 nanoseconds regardless. The two cross near 18 percent and 84 percent, so branchless only wins in the unpredictable middle.</desc>
<rect width="700" height="460" fill="#f7f7f5"/>
<g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<text x="24" y="30" font-size="15" font-weight="600" fill="#1d1d1b">The cost of a branch is the cost of guessing it wrong</text>
<text x="24" y="50" font-size="12" fill="#5a5a55">counting 262,144 values, i9-12900K pinned to one P-core, median of three runs</text>
<rect x="177.2" y="78" width="396.7" height="286" fill="#f4ece7"/>
<line x1="70" y1="364.0" x2="672" y2="364.0" stroke="#e4e4de" stroke-width="1"/>
<text x="60" y="368.0" font-size="11" fill="#5a5a55" text-anchor="end">0.0</text>
<line x1="70" y1="314.7" x2="672" y2="314.7" stroke="#e4e4de" stroke-width="1"/>
<text x="60" y="318.7" font-size="11" fill="#5a5a55" text-anchor="end">0.5</text>
<line x1="70" y1="265.4" x2="672" y2="265.4" stroke="#e4e4de" stroke-width="1"/>
<text x="60" y="269.4" font-size="11" fill="#5a5a55" text-anchor="end">1.0</text>
<line x1="70" y1="216.1" x2="672" y2="216.1" stroke="#e4e4de" stroke-width="1"/>
<text x="60" y="220.1" font-size="11" fill="#5a5a55" text-anchor="end">1.5</text>
<line x1="70" y1="166.8" x2="672" y2="166.8" stroke="#e4e4de" stroke-width="1"/>
<text x="60" y="170.8" font-size="11" fill="#5a5a55" text-anchor="end">2.0</text>
<line x1="70" y1="117.4" x2="672" y2="117.4" stroke="#e4e4de" stroke-width="1"/>
<text x="60" y="121.4" font-size="11" fill="#5a5a55" text-anchor="end">2.5</text>
<text x="24" y="70" font-size="11" fill="#5a5a55">ns per element</text>
<line x1="70" y1="364" x2="672" y2="364" stroke="#b9b9b2" stroke-width="1.5"/>
<line x1="70.0" y1="364" x2="70.0" y2="369" stroke="#b9b9b2" stroke-width="1.5"/>
<text x="70.0" y="385" font-size="11" fill="#5a5a55" text-anchor="middle">0%</text>
<line x1="220.5" y1="364" x2="220.5" y2="369" stroke="#b9b9b2" stroke-width="1.5"/>
<text x="220.5" y="385" font-size="11" fill="#5a5a55" text-anchor="middle">25%</text>
<line x1="371.0" y1="364" x2="371.0" y2="369" stroke="#b9b9b2" stroke-width="1.5"/>
<text x="371.0" y="385" font-size="11" fill="#5a5a55" text-anchor="middle">50%</text>
<line x1="521.5" y1="364" x2="521.5" y2="369" stroke="#b9b9b2" stroke-width="1.5"/>
<text x="521.5" y="385" font-size="11" fill="#5a5a55" text-anchor="middle">75%</text>
<line x1="672.0" y1="364" x2="672.0" y2="369" stroke="#b9b9b2" stroke-width="1.5"/>
<text x="672.0" y="385" font-size="11" fill="#5a5a55" text-anchor="middle">100%</text>
<text x="371" y="406" font-size="11" fill="#5a5a55" text-anchor="middle">how often the branch is taken</text>
<line x1="177.2" y1="78" x2="177.2" y2="364" stroke="#c2410c" stroke-width="1" stroke-dasharray="4 3"/>
<text x="177.2" y="70" font-size="10" fill="#c2410c" text-anchor="middle">18%</text>
<line x1="573.9" y1="78" x2="573.9" y2="364" stroke="#c2410c" stroke-width="1" stroke-dasharray="4 3"/>
<text x="573.9" y="70" font-size="10" fill="#c2410c" text-anchor="middle">84%</text>
<text x="376" y="354" font-size="11" font-weight="600" fill="#c2410c" text-anchor="middle">branchless wins in this band</text>
