<g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<text x="24" y="30" font-size="15" font-weight="600" fill="#1d1d1b">Adding threads to the packed version makes it slower</text>
<text x="24" y="50" font-size="12" fill="#5a5a55">262,144 readings, 200 passes per thread, pinned to distinct physical P-cores, median of three</text>
<text x="24" y="72" font-size="11" fill="#5a5a55">ns per element (log scale, lower is better)</text>
