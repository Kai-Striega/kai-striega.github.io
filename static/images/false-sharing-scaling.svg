<text x="600.0" y="124.7" font-size="10" fill="#5a5a55">6.28 ns</text>
<text x="600.0" y="241.1" font-size="12" font-weight="600" fill="#c2410c">padded</text>
<text x="600.0" y="256.1" font-size="10" fill="#5a5a55">0.476 ns</text>
