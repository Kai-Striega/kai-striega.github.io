<text x="64" y="147.3" font-size="11" fill="#5a5a55" text-anchor="end">3</text>
<line x1="74" y1="82.0" x2="590" y2="82.0" stroke="#e4e4de" stroke-width="1"/>
<text x="64" y="86.0" font-size="11" fill="#5a5a55" text-anchor="end">10</text>
<line x1="74" y1="241.7" x2="590" y2="241.7" stroke="#8a8a82" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="82" y="233.7" font-size="11" fill="#6a6a63">single-threaded reference, 0.435</text>
<line x1="74" y1="378" x2="590" y2="378" stroke="#b9b9b2" stroke-width="1.5"/>
<line x1="74.0" y1="378" x2="74.0" y2="383" stroke="#b9b9b2" stroke-width="1.5"/>
<text x="74.0" y="399" font-size="11" fill="#5a5a55" text-anchor="middle">1</text>
