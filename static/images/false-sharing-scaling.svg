<text x="246.0" y="399" font-size="11" fill="#5a5a55" text-anchor="middle">2</text>
<line x1="418.0" y1="378" x2="418.0" y2="383" stroke="#b9b9b2" stroke-width="1.5"/>
<text x="418.0" y="399" font-size="11" fill="#5a5a55" text-anchor="middle">4</text>
<line x1="590.0" y1="378" x2="590.0" y2="383" stroke="#b9b9b2" stroke-width="1.5"/>
<text x="590.0" y="399" font-size="11" fill="#5a5a55" text-anchor="middle">8</text>
<text x="332" y="420" font-size="11" fill="#5a5a55" text-anchor="middle">threads</text>
