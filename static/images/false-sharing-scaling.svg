<title id="t">Scaling of three counter layouts from one to eight threads</title>
<desc id="d">A log scale line chart of nanoseconds per element against thread count. The packed shared counters get worse as threads are added, from 3.72 nanoseconds at one thread to 9.07 at two and 6.28 at eight, never beating the single threaded reference of 0.435. Padding each counter to its own cache line scales almost linearly, from 3.68 down to 0.48. Accumulating in a local and storing once is fastest at every thread count, reaching 0.037 nanoseconds at eight threads.</desc>
