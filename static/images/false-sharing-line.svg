<svg xmlns="http://www.w3.org/2000/svg" width="720" height="410" viewBox="0 0 720 410" role="img" aria-labelledby="title desc">
  <style>
    /* Dark palette. CSS beats presentation attributes, so the drawing below is
       untouched. Shared verbatim across the mechanical-sympathy diagrams;
       selectors that match nothing here are harmless. */
    @media (prefers-color-scheme: dark) {
      /* canvas and neutrals */
      [fill="#f7f7f5"] { fill: #1b212a }   [stroke="#f7f7f5"] { stroke: #1b212a }
      [fill="#ffffff"] { fill: #262e3a }
      [fill="#1d1d1b"] { fill: #e3e8ee }   [stroke="#1d1d1b"] { stroke: #e3e8ee }
      [fill="#5a5a55"] { fill: #ced6dd }   [stroke="#5a5a55"] { stroke: #ced6dd }
      [fill="#6a6a63"] { fill: #9ca4af }
      [fill="#8a8a82"] { fill: #868f9c }   [stroke="#8a8a82"] { stroke: #868f9c }
      [fill="#a9a9a1"] { fill: #566072 }   [stroke="#a9a9a1"] { stroke: #566072 }
      [fill="#e8e8e2"] { fill: #333d4b }
      [fill="#dcdcd6"] { fill: #2f3947 }
      [stroke="#e4e4de"] { stroke: #394454 }
      [stroke="#b9b9b2"] { stroke: #48566b }
      [stroke="#c4c4bc"] { stroke: #48566b }
      /* blue */
      [fill="#1f6feb"] { fill: #6ea8ff }   [stroke="#1f6feb"] { stroke: #6ea8ff }
      [stroke="#12408c"] { stroke: #3d6fbf }
      [fill="#e8effb"] { fill: #1c2942 }
      /* orange */
      [fill="#c2410c"] { fill: #f08a4b }   [stroke="#c2410c"] { stroke: #f08a4b }
      [stroke="#7d2a08"] { stroke: #b35a2a }
      [fill="#f9e9e2"], [fill="#f8ebe7"], [fill="#f4ece7"] { fill: #33241c }
      /* green */
      [fill="#2f6f4f"] { fill: #57b98a }
      [stroke="#1f4a35"] { stroke: #2f7a56 }
      [fill="#4a8f6a"] { fill: #6fc79b }
      [fill="#7aa88c"] { fill: #86b89f }
      [fill="#f0f6f2"], [fill="#e3f0e9"], [fill="#d6e8de"] { fill: #1a2c24 }
      /* purple */
      [fill="#6b3fa0"] { fill: #a77dff }   [stroke="#6b3fa0"] { stroke: #a77dff }
      [fill="#f0eefa"] { fill: #251f38 }
      /* terracotta */
      [fill="#b5705f"] { fill: #d0917f }   [stroke="#b5705f"] { stroke: #d0917f }
      [stroke="#7d4436"] { stroke: #a5654f }
      /* memory-hierarchy only */
      [fill="#f7f5ee"] { fill: #1f2229 }
      [fill="#b0a98f"] { fill: #a8a184 }
      [stroke="#6b6552"] { stroke: #8a8470 }
    }
  </style>
  <title id="title">Two cores fighting over one cache line</title>
  <desc id="desc">Core 0 writes to the first eight bytes of a 64 byte cache line and core 1 writes to the next eight bytes. They never touch the same bytes, but because a core must own the whole line exclusively in order to write any part of it, the line is dragged back and forth between the two private caches. Each write invalidates the other core's copy, so every increment costs a transfer.</desc>

  <rect x="0" y="0" width="720" height="410" fill="#f7f7f5"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">

    <text x="24" y="28" font-size="15" font-weight="600" fill="#1d1d1b">Different bytes, same line, and only one owner at a time</text>

    <!-- Core 0 -->
    <rect x="24" y="54" width="200" height="76" rx="5" fill="#e8effb" stroke="#1f6feb" stroke-width="1.5"/>
    <text x="124" y="76" font-size="13" font-weight="600" fill="#1f6feb" text-anchor="middle">Core 0</text>
    <text x="124" y="96" font-size="11" fill="#1d1d1b" text-anchor="middle">counters[0].fetch_add(..)</text>
    <text x="124" y="115" font-size="11" fill="#5a5a55" text-anchor="middle">writes bytes 0 to 7</text>

    <!-- Core 1 -->
    <rect x="496" y="54" width="200" height="76" rx="5" fill="#f9e9e2" stroke="#c2410c" stroke-width="1.5"/>
    <text x="596" y="76" font-size="13" font-weight="600" fill="#c2410c" text-anchor="middle">Core 1</text>
    <text x="596" y="96" font-size="11" fill="#1d1d1b" text-anchor="middle">counters[1].fetch_add(..)</text>
    <text x="596" y="115" font-size="11" fill="#5a5a55" text-anchor="middle">writes bytes 8 to 15</text>

    <!-- Ping-pong arrows -->
    <path d="M 236 78 L 484 78" stroke="#8a8a82" stroke-width="2" fill="none"/>
    <polygon points="484,78 474,73 474,83" fill="#8a8a82"/>
    <path d="M 484 104 L 236 104" stroke="#8a8a82" stroke-width="2" fill="none"/>
    <polygon points="236,104 246,99 246,109" fill="#8a8a82"/>
    <text x="360" y="70" font-size="11" fill="#5a5a55" text-anchor="middle">the line moves this way</text>
    <text x="360" y="124" font-size="11" fill="#5a5a55" text-anchor="middle">and then back again</text>

    <!-- The cache line -->
    <text x="24" y="176" font-size="12" fill="#5a5a55">One 64 byte cache line, holding eight u64 counters:</text>

    <g font-size="10" text-anchor="middle">
      <rect x="24"  y="188" width="84" height="46" fill="#1f6feb" stroke="#12408c"/><text x="66"  y="209" fill="#ffffff" font-weight="700">counters</text><text x="66" y="223" fill="#ffffff" font-weight="700">[0]</text>
      <rect x="108" y="188" width="84" height="46" fill="#c2410c" stroke="#7d2a08"/><text x="150" y="209" fill="#ffffff" font-weight="700">counters</text><text x="150" y="223" fill="#ffffff" font-weight="700">[1]</text>
      <rect x="192" y="188" width="84" height="46" fill="#dcdcd6" stroke="#a9a9a1"/><text x="234" y="209" fill="#6a6a63">counters</text><text x="234" y="223" fill="#6a6a63">[2]</text>
      <rect x="276" y="188" width="84" height="46" fill="#dcdcd6" stroke="#a9a9a1"/><text x="318" y="209" fill="#6a6a63">counters</text><text x="318" y="223" fill="#6a6a63">[3]</text>
      <rect x="360" y="188" width="84" height="46" fill="#dcdcd6" stroke="#a9a9a1"/><text x="402" y="209" fill="#6a6a63">counters</text><text x="402" y="223" fill="#6a6a63">[4]</text>
      <rect x="444" y="188" width="84" height="46" fill="#dcdcd6" stroke="#a9a9a1"/><text x="486" y="209" fill="#6a6a63">counters</text><text x="486" y="223" fill="#6a6a63">[5]</text>
      <rect x="528" y="188" width="84" height="46" fill="#dcdcd6" stroke="#a9a9a1"/><text x="570" y="209" fill="#6a6a63">counters</text><text x="570" y="223" fill="#6a6a63">[6]</text>
      <rect x="612" y="188" width="84" height="46" fill="#dcdcd6" stroke="#a9a9a1"/><text x="654" y="209" fill="#6a6a63">counters</text><text x="654" y="223" fill="#6a6a63">[7]</text>
    </g>
    <rect x="24" y="188" width="672" height="46" fill="none" stroke="#1d1d1b" stroke-width="2.5"/>

    <!-- byte ruler -->
    <g font-size="10" fill="#8a8a82" text-anchor="middle">
      <text x="24" y="250" text-anchor="start">byte 0</text>
      <text x="360" y="250">32</text>
      <text x="696" y="250" text-anchor="end">63</text>
    </g>

    <!-- The rule -->
    <rect x="24" y="268" width="672" height="52" rx="4" fill="#f0eefa" stroke="#6b3fa0" stroke-width="1.5"/>
    <text x="360" y="290" font-size="12" font-weight="600" fill="#6b3fa0" text-anchor="middle">A core cannot write part of a line. To write any byte it must own all 64.</text>
    <text x="360" y="309" font-size="11" fill="#1d1d1b" text-anchor="middle">So core 0 taking ownership invalidates core 1's copy, and the next write drags it straight back.</text>

    <text x="24" y="352" font-size="11" fill="#5a5a55">The two cores never read or write the same bytes. There is no race, no lost update, and no bug in the</text>
    <text x="24" y="368" font-size="11" fill="#5a5a55">program's logic. The sharing is entirely an accident of where the two counters happen to sit, which is</text>
    <text x="24" y="384" font-size="11" fill="#5a5a55">why it is called false sharing.</text>
  </g>
</svg>
