<svg xmlns="http://www.w3.org/2000/svg" width="720" height="470" viewBox="0 0 720 470" role="img" aria-labelledby="title desc">
  <style>
    /* Dark palette. CSS beats presentation attributes, so the drawing below is
       untouched. Shared verbatim across the mechanical-sympathy diagrams;
       selectors that match nothing here are harmless. */
    @media (prefers-color-scheme: dark) {
      /* canvas and neutrals */
      [fill="#f7f7f5"] { fill: #1b212a }   [stroke="#f7f7f5"] { stroke: #1b212a }
      [fill="#ffffff"] { fill: #262e3a }
      [fill="#1d1d1b"] { fill: #e3e8ee }   [stroke="#1d1d1b"] { stroke: #e3e8ee }
      [fill="#5a5a55"] { fill: #ced6dd }   [stroke="#5a5a55"] { stroke: #ced6dd }
      [fill="#6a6a63"] { fill: #9ca4af }
      [fill="#8a8a82"] { fill: #868f9c }   [stroke="#8a8a82"] { stroke: #868f9c }
      [fill="#a9a9a1"] { fill: #566072 }   [stroke="#a9a9a1"] { stroke: #566072 }
      [fill="#e8e8e2"] { fill: #333d4b }
      [fill="#dcdcd6"] { fill: #2f3947 }
      [stroke="#e4e4de"] { stroke: #394454 }
      [stroke="#b9b9b2"] { stroke: #48566b }
      [stroke="#c4c4bc"] { stroke: #48566b }
      /* blue */
      [fill="#1f6feb"] { fill: #6ea8ff }   [stroke="#1f6feb"] { stroke: #6ea8ff }
      [stroke="#12408c"] { stroke: #3d6fbf }
      [fill="#e8effb"] { fill: #1c2942 }
      /* orange */
      [fill="#c2410c"] { fill: #f08a4b }   [stroke="#c2410c"] { stroke: #f08a4b }
      [stroke="#7d2a08"] { stroke: #b35a2a }
      [fill="#f9e9e2"], [fill="#f8ebe7"], [fill="#f4ece7"] { fill: #33241c }
      /* green */
      [fill="#2f6f4f"] { fill: #57b98a }
      [stroke="#1f4a35"] { stroke: #2f7a56 }
      [fill="#4a8f6a"] { fill: #6fc79b }
      [fill="#7aa88c"] { fill: #86b89f }
      [fill="#f0f6f2"], [fill="#e3f0e9"], [fill="#d6e8de"] { fill: #1a2c24 }
      /* purple */
      [fill="#6b3fa0"] { fill: #a77dff }   [stroke="#6b3fa0"] { stroke: #a77dff }
      [fill="#f0eefa"] { fill: #251f38 }
      /* terracotta */
      [fill="#b5705f"] { fill: #d0917f }   [stroke="#b5705f"] { stroke: #d0917f }
      [stroke="#7d4436"] { stroke: #a5654f }
      /* memory-hierarchy only */
      [fill="#f7f5ee"] { fill: #1f2229 }
      [fill="#b0a98f"] { fill: #a8a184 }
      [stroke="#6b6552"] { stroke: #8a8470 }
    }
  </style>
  <title id="title">Cost per element as the working set grows</title>
  <desc id="desc">A log-log chart of nanoseconds per element against the number of elements, for three layouts. Walking a contiguous array stays flat at roughly 0.06 to 0.37 nanoseconds per element across the whole range. Walking the same heap objects in shuffled order through an array of pointers rises from 0.19 to 8.2 nanoseconds. Chasing a linked list through the same objects in the same order rises from 1.0 to 110 nanoseconds, with a sharp step upward at about one million elements, which is where its nodes stop fitting in the 30 mebibyte L3 cache. At the largest size the chase costs roughly 300 times as much per element as the contiguous walk.</desc>

  <rect x="0" y="0" width="720" height="470" fill="#f7f7f5"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">

    <text x="24" y="26" font-size="15" font-weight="600" fill="#1d1d1b">The same values, three layouts, one core</text>
    <text x="24" y="44" font-size="12" fill="#5a5a55">Nanoseconds per element. Both axes are logarithmic.</text>

    <!-- Gridlines and y axis -->
    <g stroke="#e4e4de" stroke-width="1">
      <line x1="62" y1="340.1" x2="566" y2="340.1"/>
      <line x1="62" y1="254.0" x2="566" y2="254.0"/>
      <line x1="62" y1="167.9" x2="566" y2="167.9"/>
      <line x1="62" y1="81.9"  x2="566" y2="81.9"/>
    </g>
    <g font-size="11" fill="#5a5a55" text-anchor="end">
      <text x="54" y="344.1">0.1</text>
      <text x="54" y="258.0">1</text>
      <text x="54" y="171.9">10</text>
      <text x="54" y="85.9">100</text>
    </g>
    <line x1="62" y1="56" x2="62" y2="366" stroke="#a9a9a1" stroke-width="1"/>
    <line x1="62" y1="366" x2="566" y2="366" stroke="#a9a9a1" stroke-width="1"/>

    <!-- Cache boundaries, sized for the 32 byte heap nodes -->
    <g stroke="#8a8a82" stroke-width="1" stroke-dasharray="4 3">
      <line x1="268.2" y1="62" x2="268.2" y2="366"/>
      <line x1="446.1" y1="62" x2="446.1" y2="366"/>
    </g>
    <text x="264" y="72" font-size="10" fill="#8a8a82" text-anchor="end">nodes outgrow L2</text>
    <text x="450" y="72" font-size="10" fill="#8a8a82">nodes outgrow L3</text>

    <!-- x axis labels -->
    <g font-size="11" fill="#5a5a55" text-anchor="middle">
      <text x="62"    y="384">1K</text>
      <text x="178.3" y="384">8K</text>
      <text x="294.6" y="384">64K</text>
      <text x="410.9" y="384">512K</text>
      <text x="527.2" y="384">4M</text>
    </g>
    <text x="314" y="406" font-size="12" fill="#5a5a55" text-anchor="middle">elements</text>

    <!-- Series: contiguous array -->
    <polyline fill="none" stroke="#1f6feb" stroke-width="2" stroke-linejoin="round" points="62,359.2 100.8,359.2 139.5,353.4 178.3,353.4 217.1,353.4 255.9,353.4 294.6,353.4 333.4,344.0 372.2,330.3 410.9,327.5 449.7,330.3 488.5,327.5 527.2,299.0 566,291.2"/>
    <g fill="#1f6feb" stroke="#f7f7f5" stroke-width="2">
      <circle cx="62" cy="359.2" r="4"/><circle cx="100.8" cy="359.2" r="4"/><circle cx="139.5" cy="353.4" r="4"/><circle cx="178.3" cy="353.4" r="4"/><circle cx="217.1" cy="353.4" r="4"/><circle cx="255.9" cy="353.4" r="4"/><circle cx="294.6" cy="353.4" r="4"/><circle cx="333.4" cy="344.0" r="4"/><circle cx="372.2" cy="330.3" r="4"/><circle cx="410.9" cy="327.5" r="4"/><circle cx="449.7" cy="330.3" r="4"/><circle cx="488.5" cy="327.5" r="4"/><circle cx="527.2" cy="299.0" r="4"/><circle cx="566" cy="291.2" r="4"/>
    </g>

    <!-- Series: shuffled pointers -->
    <polyline fill="none" stroke="#c2410c" stroke-width="2" stroke-linejoin="round" points="62,316.1 100.8,304.4 139.5,300.3 178.3,299.0 217.1,296.6 255.9,285.6 294.6,256.3 333.4,249.5 372.2,249.8 410.9,230.2 449.7,197.0 488.5,183.5 527.2,177.7 566,175.3"/>
    <g fill="#c2410c" stroke="#f7f7f5" stroke-width="2">
      <circle cx="62" cy="316.1" r="4"/><circle cx="100.8" cy="304.4" r="4"/><circle cx="139.5" cy="300.3" r="4"/><circle cx="178.3" cy="299.0" r="4"/><circle cx="217.1" cy="296.6" r="4"/><circle cx="255.9" cy="285.6" r="4"/><circle cx="294.6" cy="256.3" r="4"/><circle cx="333.4" cy="249.5" r="4"/><circle cx="372.2" cy="249.8" r="4"/><circle cx="410.9" cy="230.2" r="4"/><circle cx="449.7" cy="197.0" r="4"/><circle cx="488.5" cy="183.5" r="4"/><circle cx="527.2" cy="177.7" r="4"/><circle cx="566" cy="175.3" r="4"/>
    </g>

    <!-- Series: pointer chase -->
    <polyline fill="none" stroke="#6b3fa0" stroke-width="2" stroke-linejoin="round" points="62,254.0 100.8,226.1 139.5,213.8 178.3,210.3 217.1,201.7 255.9,185.9 294.6,160.2 333.4,153.4 372.2,148.6 410.9,134.1 449.7,91.1 488.5,82.1 527.2,79.6 566,78.4"/>
    <g fill="#6b3fa0" stroke="#f7f7f5" stroke-width="2">
      <circle cx="62" cy="254.0" r="4"/><circle cx="100.8" cy="226.1" r="4"/><circle cx="139.5" cy="213.8" r="4"/><circle cx="178.3" cy="210.3" r="4"/><circle cx="217.1" cy="201.7" r="4"/><circle cx="255.9" cy="185.9" r="4"/><circle cx="294.6" cy="160.2" r="4"/><circle cx="333.4" cy="153.4" r="4"/><circle cx="372.2" cy="148.6" r="4"/><circle cx="410.9" cy="134.1" r="4"/><circle cx="449.7" cy="91.1" r="4"/><circle cx="488.5" cy="82.1" r="4"/><circle cx="527.2" cy="79.6" r="4"/><circle cx="566" cy="78.4" r="4"/>
    </g>

    <!-- Direct labels -->
    <text x="576" y="82.4"  font-size="11" font-weight="600" fill="#6b3fa0">pointer chase</text>
    <text x="576" y="96"    font-size="10" fill="#5a5a55">110 ns</text>
    <text x="576" y="179.3" font-size="11" font-weight="600" fill="#c2410c">shuffled pointers</text>
    <text x="576" y="192.9" font-size="10" fill="#5a5a55">8.2 ns</text>
    <text x="576" y="295.2" font-size="11" font-weight="600" fill="#1f6feb">contiguous</text>
    <text x="576" y="308.8" font-size="10" fill="#5a5a55">0.37 ns</text>

    <!-- Legend -->
    <g font-size="11" fill="#1d1d1b">
      <rect x="24" y="422" width="12" height="12" rx="2" fill="#1f6feb"/>
      <text x="42" y="432">contiguous array</text>
      <rect x="164" y="422" width="12" height="12" rx="2" fill="#c2410c"/>
      <text x="182" y="432">array of pointers, shuffled</text>
      <rect x="360" y="422" width="12" height="12" rx="2" fill="#6b3fa0"/>
      <text x="378" y="432">linked list, same objects</text>
    </g>

    <text x="24" y="456" font-size="11" fill="#5a5a55">The orange and purple series walk the identical heap objects in the identical order. The only difference is where the next address comes from.</text>
  </g>
</svg>
