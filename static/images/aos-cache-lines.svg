<svg xmlns="http://www.w3.org/2000/svg" width="700" height="290" viewBox="0 0 700 290" role="img" aria-labelledby="title desc">
  <style>
    /* Dark palette. CSS beats presentation attributes, so the drawing below is
       untouched. Shared verbatim across the mechanical-sympathy diagrams;
       selectors that match nothing here are harmless. */
    @media (prefers-color-scheme: dark) {
      /* canvas and neutrals */
      [fill="#f7f7f5"] { fill: #1b212a }   [stroke="#f7f7f5"] { stroke: #1b212a }
      [fill="#ffffff"] { fill: #262e3a }
      [fill="#1d1d1b"] { fill: #e3e8ee }   [stroke="#1d1d1b"] { stroke: #e3e8ee }
      [fill="#5a5a55"] { fill: #ced6dd }   [stroke="#5a5a55"] { stroke: #ced6dd }
      [fill="#6a6a63"] { fill: #9ca4af }
      [fill="#8a8a82"] { fill: #868f9c }   [stroke="#8a8a82"] { stroke: #868f9c }
      [fill="#a9a9a1"] { fill: #566072 }   [stroke="#a9a9a1"] { stroke: #566072 }
      [fill="#e8e8e2"] { fill: #333d4b }
      [fill="#dcdcd6"] { fill: #2f3947 }
      [stroke="#e4e4de"] { stroke: #394454 }
      [stroke="#b9b9b2"] { stroke: #48566b }
      [stroke="#c4c4bc"] { stroke: #48566b }
      /* blue */
      [fill="#1f6feb"] { fill: #6ea8ff }   [stroke="#1f6feb"] { stroke: #6ea8ff }
      [stroke="#12408c"] { stroke: #3d6fbf }
      [fill="#e8effb"] { fill: #1c2942 }
      /* orange */
      [fill="#c2410c"] { fill: #f08a4b }   [stroke="#c2410c"] { stroke: #f08a4b }
      [stroke="#7d2a08"] { stroke: #b35a2a }
      [fill="#f9e9e2"], [fill="#f8ebe7"], [fill="#f4ece7"] { fill: #33241c }
      /* green */
      [fill="#2f6f4f"] { fill: #57b98a }
      [stroke="#1f4a35"] { stroke: #2f7a56 }
      [fill="#4a8f6a"] { fill: #6fc79b }
      [fill="#7aa88c"] { fill: #86b89f }
      [fill="#f0f6f2"], [fill="#e3f0e9"], [fill="#d6e8de"] { fill: #1a2c24 }
      /* purple */
      [fill="#6b3fa0"] { fill: #a77dff }   [stroke="#6b3fa0"] { stroke: #a77dff }
      [fill="#f0eefa"] { fill: #251f38 }
      /* terracotta */
      [fill="#b5705f"] { fill: #d0917f }   [stroke="#b5705f"] { stroke: #d0917f }
      [stroke="#7d4436"] { stroke: #a5654f }
      /* memory-hierarchy only */
      [fill="#f7f5ee"] { fill: #1f2229 }
      [fill="#b0a98f"] { fill: #a8a184 }
      [stroke="#6b6552"] { stroke: #8a8470 }
    }
  </style>
  <title id="title">An array of structs laid over cache lines</title>
  <desc id="desc">Four 32 byte Reading structs stored back to back, spanning two 64 byte cache lines. Each struct contains timestamp, station id, temperature, humidity, pressure, wind speed and rainfall. Only the temperature field is wanted, so of every 32 bytes pulled from memory just 4 are used and the other 28 are loaded and thrown away.</desc>

  <rect x="0" y="0" width="700" height="290" fill="#f7f7f5"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">

    <text x="30" y="28" font-size="15" font-weight="600" fill="#1d1d1b">Array of structs: Vec&lt;Reading&gt;</text>

    <!-- Cache line brackets -->
    <g stroke="#5a5a55" stroke-width="1.5" fill="none">
      <path d="M 30 74 L 30 66 L 350 66 L 350 74"/>
      <path d="M 350 74 L 350 66 L 670 66 L 670 74"/>
    </g>
    <text x="190" y="58" text-anchor="middle" font-size="12" fill="#5a5a55">cache line 0 — 64 bytes</text>
    <text x="510" y="58" text-anchor="middle" font-size="12" fill="#5a5a55">cache line 1 — 64 bytes</text>

    <!-- Reading 0 -->
    <g font-size="8">
      <rect x="30"  y="82" width="40" height="46" fill="#dcdcd6" stroke="#a9a9a1"/><text x="50"  y="109" text-anchor="middle" fill="#6a6a63">time</text>
      <rect x="70"  y="82" width="20" height="46" fill="#dcdcd6" stroke="#a9a9a1"/><text x="80"  y="109" text-anchor="middle" fill="#6a6a63">id</text>
      <rect x="90"  y="82" width="20" height="46" fill="#2f6f4f" stroke="#1f4a35"/><text x="100" y="109" text-anchor="middle" fill="#ffffff" font-weight="700">temp</text>
      <rect x="110" y="82" width="20" height="46" fill="#dcdcd6" stroke="#a9a9a1"/><text x="120" y="109" text-anchor="middle" fill="#6a6a63">hum</text>
      <rect x="130" y="82" width="20" height="46" fill="#dcdcd6" stroke="#a9a9a1"/><text x="140" y="109" text-anchor="middle" fill="#6a6a63">pres</text>
      <rect x="150" y="82" width="20" height="46" fill="#dcdcd6" stroke="#a9a9a1"/><text x="160" y="109" text-anchor="middle" fill="#6a6a63">wind</text>
      <rect x="170" y="82" width="20" height="46" fill="#dcdcd6" stroke="#a9a9a1"/><text x="180" y="109" text-anchor="middle" fill="#6a6a63">rain</text>

      <!-- Reading 1 -->
      <rect x="190" y="82" width="40" height="46" fill="#dcdcd6" stroke="#a9a9a1"/><text x="210" y="109" text-anchor="middle" fill="#6a6a63">time</text>
      <rect x="230" y="82" width="20" height="46" fill="#dcdcd6" stroke="#a9a9a1"/><text x="240" y="109" text-anchor="middle" fill="#6a6a63">id</text>
      <rect x="250" y="82" width="20" height="46" fill="#2f6f4f" stroke="#1f4a35"/><text x="260" y="109" text-anchor="middle" fill="#ffffff" font-weight="700">temp</text>
      <rect x="270" y="82" width="20" height="46" fill="#dcdcd6" stroke="#a9a9a1"/><text x="280" y="109" text-anchor="middle" fill="#6a6a63">hum</text>
      <rect x="290" y="82" width="20" height="46" fill="#dcdcd6" stroke="#a9a9a1"/><text x="300" y="109" text-anchor="middle" fill="#6a6a63">pres</text>
      <rect x="310" y="82" width="20" height="46" fill="#dcdcd6" stroke="#a9a9a1"/><text x="320" y="109" text-anchor="middle" fill="#6a6a63">wind</text>
      <rect x="330" y="82" width="20" height="46" fill="#dcdcd6" stroke="#a9a9a1"/><text x="340" y="109" text-anchor="middle" fill="#6a6a63">rain</text>

      <!-- Reading 2 -->
      <rect x="350" y="82" width="40" height="46" fill="#dcdcd6" stroke="#a9a9a1"/><text x="370" y="109" text-anchor="middle" fill="#6a6a63">time</text>
      <rect x="390" y="82" width="20" height="46" fill="#dcdcd6" stroke="#a9a9a1"/><text x="400" y="109" text-anchor="middle" fill="#6a6a63">id</text>
      <rect x="410" y="82" width="20" height="46" fill="#2f6f4f" stroke="#1f4a35"/><text x="420" y="109" text-anchor="middle" fill="#ffffff" font-weight="700">temp</text>
      <rect x="430" y="82" width="20" height="46" fill="#dcdcd6" stroke="#a9a9a1"/><text x="440" y="109" text-anchor="middle" fill="#6a6a63">hum</text>
      <rect x="450" y="82" width="20" height="46" fill="#dcdcd6" stroke="#a9a9a1"/><text x="460" y="109" text-anchor="middle" fill="#6a6a63">pres</text>
      <rect x="470" y="82" width="20" height="46" fill="#dcdcd6" stroke="#a9a9a1"/><text x="480" y="109" text-anchor="middle" fill="#6a6a63">wind</text>
      <rect x="490" y="82" width="20" height="46" fill="#dcdcd6" stroke="#a9a9a1"/><text x="500" y="109" text-anchor="middle" fill="#6a6a63">rain</text>

      <!-- Reading 3 -->
      <rect x="510" y="82" width="40" height="46" fill="#dcdcd6" stroke="#a9a9a1"/><text x="530" y="109" text-anchor="middle" fill="#6a6a63">time</text>
      <rect x="550" y="82" width="20" height="46" fill="#dcdcd6" stroke="#a9a9a1"/><text x="560" y="109" text-anchor="middle" fill="#6a6a63">id</text>
      <rect x="570" y="82" width="20" height="46" fill="#2f6f4f" stroke="#1f4a35"/><text x="580" y="109" text-anchor="middle" fill="#ffffff" font-weight="700">temp</text>
      <rect x="590" y="82" width="20" height="46" fill="#dcdcd6" stroke="#a9a9a1"/><text x="600" y="109" text-anchor="middle" fill="#6a6a63">hum</text>
      <rect x="610" y="82" width="20" height="46" fill="#dcdcd6" stroke="#a9a9a1"/><text x="620" y="109" text-anchor="middle" fill="#6a6a63">pres</text>
      <rect x="630" y="82" width="20" height="46" fill="#dcdcd6" stroke="#a9a9a1"/><text x="640" y="109" text-anchor="middle" fill="#6a6a63">wind</text>
      <rect x="650" y="82" width="20" height="46" fill="#dcdcd6" stroke="#a9a9a1"/><text x="660" y="109" text-anchor="middle" fill="#6a6a63">rain</text>
    </g>

    <!-- Cache line boundaries drawn on top -->
    <g fill="none" stroke="#1d1d1b" stroke-width="2">
      <rect x="30" y="82" width="320" height="46"/>
      <rect x="350" y="82" width="320" height="46"/>
    </g>

    <!-- Reading brackets -->
    <g stroke="#a9a9a1" stroke-width="1.5" fill="none">
      <path d="M 30 136 L 30 144 L 190 144 L 190 136"/>
      <path d="M 190 136 L 190 144 L 350 144 L 350 136"/>
      <path d="M 350 136 L 350 144 L 510 144 L 510 136"/>
      <path d="M 510 136 L 510 144 L 670 144 L 670 136"/>
    </g>
    <g font-size="11" fill="#6a6a63" text-anchor="middle">
      <text x="110" y="158">Reading 0 — 32 B</text>
      <text x="270" y="158">Reading 1 — 32 B</text>
      <text x="430" y="158">Reading 2 — 32 B</text>
      <text x="590" y="158">Reading 3 — 32 B</text>
    </g>

    <!-- Legend -->
    <rect x="30" y="188" width="14" height="14" fill="#2f6f4f" stroke="#1f4a35"/>
    <text x="52" y="200" font-size="12" fill="#1d1d1b">the 4 bytes we actually asked for</text>
    <rect x="300" y="188" width="14" height="14" fill="#dcdcd6" stroke="#a9a9a1"/>
    <text x="322" y="200" font-size="12" fill="#1d1d1b">the 28 bytes that came along anyway</text>

    <text x="30" y="234" font-size="13" font-weight="600" fill="#b5705f">Two cache lines, 128 bytes moved, 16 bytes used.</text>
    <text x="30" y="254" font-size="12" fill="#5a5a55">Memory arrives one 64 byte line at a time, so seven eighths of everything the CPU</text>
    <text x="30" y="270" font-size="12" fill="#5a5a55">fetches here is thrown away before it is ever looked at.</text>
  </g>
</svg>
