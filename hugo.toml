baseURL = 'https://kaistriega.com/'
languageCode = 'en-us'
title = 'Kai Striega'
theme = 'scientific-python-hugo-theme'
# Tags render as #rust and #cpu-caches, not #Rust and #Cpu-Caches.
capitalizeListTitles = false

# Posts are tagged; categories are unused, and an empty category index would be
# another URL in the sitemap with nothing behind it. Series live in content
# directories instead.
[taxonomies]
  tag = 'tags'
# Pass LaTeX through Markdown untouched so MathJax (loaded by the theme) sees it as written.
# Display maths is $$ ... $$ (or \[ ... \]); inline maths is \( ... \). Single dollars are not
# delimiters, so prices in prose stay prices.
[markup.goldmark.extensions.passthrough]
  enable = true
  [markup.goldmark.extensions.passthrough.delimiters]
    block = [['$$', '$$'], ['\[', '\]']]
    inline = [['\(', '\)']]

# Emit CSS classes for highlighted code instead of inline colours, so
# assets/css/syntax.css can switch palettes with the site's light/dark mode.
[markup.highlight]
  noClasses = false

[outputs]
  home = ['html', 'rss']
  section = ['html', 'rss']
  taxonomy = ['html', 'rss']
  term = ['html', 'rss']

[params]
  description = 'Kai Striega on scientific computing and performance: SciPy and NumPy internals, CPU caches, and how the machine underneath shapes the code you write.'
  # Link-preview image for pages without their own. Must be a raster image:
  # X and Open Graph consumers do not render SVG (the theme defaults to logo.svg).
  images = ['/images/og-default.png']

[params.author]
  name = 'Kai Striega'

[params.footer]
  logo = 'logo.svg'
  socialmediatitle = ''

  [params.footer.quicklinks.site]
    title = ''
    [[params.footer.quicklinks.site.links]]
      text = 'Blog'
      link = '/blog/'
    [[params.footer.quicklinks.site.links]]
      text = 'About'
      link = '/about/'
    [[params.footer.quicklinks.site.links]]
      text = 'Subscribe (RSS)'
      link = '/blog/index.xml'

  [[params.footer.socialmedia]]
    link = 'https://github.com/Kai-Striega'
    icon = 'github'
  [[params.footer.socialmedia]]
    link = '/blog/index.xml'
    icon = 'rss-feed'
  [[params.footer.socialmedia]]
    link = 'mailto:me@kaistriega.com'
    icon = 'mail'
